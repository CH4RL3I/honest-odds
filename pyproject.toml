[project]
name = "pmcal"
version = "0.1.0"
description = "Calibration and mispricing study of resolved Polymarket markets"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Emilio Gappa" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "httpx>=0.27",
    "pyarrow>=15",
]

[project.scripts]
pmcal = "pmcal.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmcal"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
